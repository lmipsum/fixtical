name: Feature Request
description: Suggest something fixtical should do.
title: "[FR]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please elaborate.
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should the calendar show, or how should it be configured?
    validations:
      required: true
  - type: checkboxes
    id: kind
    attributes:
      label: Does your request involve any of the following?
      options:
        - label: Another federation, sport or league
        - label: A new output format or calendar app
        - label: A new setting
